syntax = "proto3";

import "theme_config.proto";

option java_package = "dev.sethdegay.sequence.core.datastore";
option java_multiple_files = true;

message Settings {
  ThemeConfig theme_config = 1;
  bool dynamic_color = 2;
  bool mute_all = 3;
  bool tick_sound = 4;
  bool completion_sound = 5;
  bool speak_title = 6;
  bool speak_next_title = 7;
}